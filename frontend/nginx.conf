server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de /api para a API do back-end. Sem URI no proxy_pass (nem
    # barra final), para preservar o path completo: nginx repassa
    # /api/municipios/3550308 como /api/municipios/3550308, não corta o
    # prefixo `/api` — as rotas do Fastify já são registradas com esse
    # prefixo (ver backend/src/routes).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos do build do Vite: SPA fallback para index.html nas rotas
    # do react-router/navegação client-side (se houver).
    location / {
        try_files $uri /index.html;
    }
}
